services:
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_SITE_ADDRESS=${CADDY_SITE_ADDRESS:-:80}
    depends_on:
      - frontend
      - backend

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-axonrelay}
      - POSTGRES_USER=${POSTGRES_USER:-axonrelay}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-axonrelay_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: always
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://axonrelay:axonrelay_dev@postgres:5432/axonrelay}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  postgres_data:
