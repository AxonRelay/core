name: CI

# The workflow only checks out and tests; it never writes to the repository,
# so the token it receives should not be able to either.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff>=0.8.0

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

  test-backend:
    name: Test Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  test-migrations:
    name: Test Migrations (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axonrelay
          POSTGRES_PASSWORD: axonrelay_dev
          POSTGRES_DB: axonrelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axonrelay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The SQLite suite builds its schema from Base.metadata and degrades Enum
      # to VARCHAR, so it can validate neither the migration chain nor the enum
      # labels. Both hid real production-only defects; this job runs the real
      # migrations against the real database engine.
      - name: Run Postgres schema-parity tests
        env:
          AXONRELAY_TEST_POSTGRES_URL: postgresql://axonrelay:axonrelay_dev@localhost:5432/axonrelay_test
        run: pytest tests/test_postgres_schema.py -q

  lint-docs:
    name: Lint Docs (claim check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Wording guard only: fails on phrases that previously reintroduced
      # overstated regulatory claims. Accuracy is a review responsibility;
      # see docs/regulatory-positioning.md.
      - name: Check documentation claims
        run: |
          python3 scripts/check_doc_claims.py --selftest
          python3 scripts/check_doc_claims.py

  build-frontend:
    name: Build Frontend (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
